<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist — Manchester Boiler & Plumbing</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --bubble-ai: #334155;
            --bubble-user: #1e293b;
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header Card */
        .header-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .header-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Chat Container */
        .chat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 380px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9375rem;
            line-height: 1.4;
        }

        .message.ai {
            background-color: var(--bubble-ai);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-primary);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 12px;
            background-color: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.9375rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: var(--accent);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            background-color: var(--border);
            color: var(--text-primary);
            border: none;
            border-radius: 6px;
            padding: 6px;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #475569;
        }

        /* Dashboard Card */
        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .status-badge {
            background-color: var(--success-bg);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .status-badge.paused {
            background-color: rgba(234, 179, 8, 0.1);
            color: #eab308;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .metric-box {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-card">
            <div class="header-title">AI Receptionist</div>
            <div class="header-subtitle">Manchester Boiler & Plumbing — prototype</div>
        </div>

        <!-- Chat Box -->
        <div class="chat-card">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">Hi! I'm the AI receptionist for Manchester Boiler & Plumbing. How can I help?</div>
            </div>
            <div class="chat-input-area">
                <div class="input-row">
                    <input type="text" id="userInput" class="chat-input" placeholder="Type a customer enquiry..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" onclick="resetDemo()">Reset</button>
                    <button class="action-btn" onclick="triggerHumanTakeover()">Human takeover</button>
                </div>
            </div>
        </div>

        <!-- Business Dashboard -->
        <div class="dashboard-card">
            <div class="dashboard-header">
                <div class="dashboard-title">Business dashboard</div>
                <div id="statusBadge" class="status-badge">AI ONLINE</div>
            </div>
            <div class="metrics-grid">
                <div class="metric-box">
                    <span class="metric-label">Enquiries</span>
                    <span id="metricEnquiries" class="metric-value">0</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Qualified</span>
                    <span id="metricQualified" class="metric-value">0</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Bookings</span>
                    <span id="metricBookings" class="metric-value">0</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Human handoffs</span>
                    <span id="metricHandoffs" class="metric-value">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Machine Steps for the Prototype
        let conversationState = 'START'; // START, WAITING_AREA, WAITING_TIME, BOOKED, PAUSED
        let metrics = {
            enquiries: 0,
            qualified: 0,
            bookings: 0,
            handoffs: 0
        };

        function updateDashboard() {
            document.getElementById('metricEnquiries').innerText = metrics.enquiries;
            document.getElementById('metricQualified').innerText = metrics.qualified;
            document.getElementById('metricBookings').innerText = metrics.bookings;
            document.getElementById('metricHandoffs').innerText = metrics.handoffs;
        }

        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';

            // If paused, ignore AI workflow logic
            if (conversationState === 'PAUSED') return;

            // Check for explicit human request at any point
            const lowerText = text.toLowerCase();
            if (lowerText.includes('human') || lowerText.includes('speak to someone') || lowerText.includes('agent') || lowerText.includes('person')) {
                triggerHumanTakeover();
                return;
            }

            // AI Flow Logic with Service Area Policy Check
            setTimeout(() => {
                if (conversationState === 'START') {
                    metrics.enquiries = 1;
                    updateDashboard();

                    // Check for out-of-area location immediately (Service Area Policy)
                    if (lowerText.includes('liverpool') || lowerText.includes('leeds') || lowerText.includes('london')) {
                        appendMessage("Sorry, we only operate within the Manchester and surrounding M postcode areas and cannot cover your location.", 'ai');
                        conversationState = 'START';
                        return;
                    }

                    if (lowerText.includes('boiler') || lowerText.includes('plumbing') || lowerText.includes('broken') || lowerText.includes('leak')) {
                        conversationState = 'WAITING_AREA';
                        appendMessage("I can help with that. What is your postcode or area?", 'ai');
                    } else if (lowerText.includes('liverpool') || lowerText.includes('outside')) {
                        appendMessage("Sorry, we only cover the Manchester area.", 'ai');
                    } else {
                        appendMessage("Sure — what service do you need help with?", 'ai');
                        conversationState = 'WAITING_AREA';
                    }
                } 
                else if (conversationState === 'WAITING_AREA') {
                    // Check area/postcode response for out-of-area locations
                    if (lowerText.includes('liverpool') || lowerText.includes('leeds') || lowerText.includes('l1') || lowerText.includes('l2')) {
                        appendMessage("Sorry, we only operate within the Manchester area and cannot service Liverpool.", 'ai');
                        conversationState = 'START';
                        return;
                    }

                    conversationState = 'WAITING_TIME';
                    appendMessage("Thanks. What day would you like someone to come out?", 'ai');
                } 
                else if (conversationState === 'WAITING_TIME') {
                    metrics.qualified = 1;
                    updateDashboard();
                    conversationState = 'BOOKED';
                    appendMessage("What time would suit you? Available demo slots are 09:00, 10:30, 12:00, 14:00, 15:30 and 17:00.", 'ai');
                } 
                else if (conversationState === 'BOOKED') {
                    metrics.bookings = 1;
                    updateDashboard();
                    appendMessage("Booked successfully. Your reference is MBP-3886. The appointment is scheduled.", 'ai');
                }
            }, 600);
        }

        function resetDemo() {
            conversationState = 'START';
            metrics = { enquiries: 0, qualified: 0, bookings: 0, handoffs: 0 };
            updateDashboard();

            const badge = document.getElementById('statusBadge');
            badge.innerText = "AI ONLINE";
            badge.className = "status-badge";

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '<div class="message ai">Hi! I\'m the AI receptionist for Manchester Boiler & Plumbing. How can I help?</div>';
        }

        function triggerHumanTakeover() {
            conversationState = 'PAUSED';
            metrics.handoffs += 1;
            updateDashboard();

            const badge = document.getElementById('statusBadge');
            badge.innerText = "AI PAUSED";
            badge.className = "status-badge paused";

            appendMessage("I've paused the AI workflow. A human team member can now take over this enquiry.", 'ai');
        }
    </script>
</body>
</html>
